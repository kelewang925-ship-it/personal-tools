<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101313">
  <meta name="description" content="个人工具箱，快速打开常用网页工具。">
  <title>个人工具箱</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101313;
      --panel: #191f1f;
      --panel-hi: #202928;
      --line: rgb(255 255 255 / .1);
      --text: #f5f7f4;
      --muted: #a4afaa;
      --quiet: #74807b;
      --accent: #79e0bb;
      --accent-ink: #10251e;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background:
        linear-gradient(rgb(255 255 255 / .025) 1px, transparent 1px),
        linear-gradient(90deg, rgb(255 255 255 / .025) 1px, transparent 1px),
        radial-gradient(circle at 84% -8%, rgb(54 102 84 / .4), transparent 36%),
        var(--bg);
      background-size: 28px 28px, 28px 28px, auto, auto;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }
    main { width: min(100%, 720px); min-height: 100dvh; margin: auto; padding: max(24px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom)); }
    header { padding: 18px 4px 36px; }
    .topline { display: flex; align-items: center; justify-content: space-between; margin-bottom: 52px; color: var(--quiet); font-size: 11px; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
    .mark { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); }
    .mark::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 5px rgb(121 224 187 / .12); }
    .count { font-variant-numeric: tabular-nums; }
    h1 { max-width: 9em; margin: 0; font-size: clamp(34px, 10vw, 58px); line-height: 1.04; letter-spacing: -.06em; }
    .intro { max-width: 32em; margin: 18px 0 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .section-label { display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px 12px; color: var(--quiet); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .section-label strong { color: var(--text); font-size: 14px; letter-spacing: 0; text-transform: none; }
    .tools { display: grid; gap: 12px; }
    .tool {
      position: relative;
      display: block;
      overflow: hidden;
      min-height: 214px;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(145deg, var(--panel-hi), var(--panel));
      color: inherit;
      text-decoration: none;
      box-shadow: 0 20px 50px rgb(0 0 0 / .2), inset 0 1px 0 rgb(255 255 255 / .05);
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .tool::after { content: ""; position: absolute; width: 180px; height: 180px; right: -58px; bottom: -86px; border: 1px solid rgb(121 224 187 / .16); border-radius: 50%; box-shadow: 0 0 0 22px rgb(121 224 187 / .035), 0 0 0 46px rgb(121 224 187 / .025); pointer-events: none; }
    .tool:active { transform: scale(.985); }
    .tool:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .tool-top { display: flex; align-items: flex-start; justify-content: space-between; }
    .icon { display: grid; width: 58px; height: 58px; place-items: center; border: 1px solid rgb(121 224 187 / .28); border-radius: 18px; background: var(--accent-ink); color: var(--accent); font-size: 30px; box-shadow: inset 0 1px 0 rgb(255 255 255 / .1); }
    .arrow { display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid var(--line); border-radius: 50%; color: var(--muted); font-size: 25px; transition: transform .18s ease, color .18s ease, background .18s ease; }
    .tool:hover .arrow { transform: translate(2px, -2px); background: var(--accent); color: var(--accent-ink); }
    .copy { position: relative; z-index: 1; display: block; margin-top: 28px; }
    .copy strong { display: block; font-size: 21px; letter-spacing: -.02em; }
    .copy span { display: block; max-width: 29em; margin-top: 8px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .tool-meta { position: relative; z-index: 1; display: flex; gap: 18px; margin-top: 19px; color: var(--quiet); font-size: 12px; }
    .tool-meta span { display: inline-flex; align-items: center; gap: 6px; }
    .tool-meta span::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    footer { padding: 28px 4px 0; color: var(--quiet); font-size: 12px; }
    @media (hover: hover) { .tool:hover { border-color: rgb(121 224 187 / .48); background: linear-gradient(145deg, #263330, #1a2221); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="topline"><span class="mark">Personal tools</span><span class="count">01 / 工具</span></div>
      <h1>把常用工具，放在手边。</h1>
      <p class="intro">轻量、直接、打开即用。工具在浏览器本地运行，不需要安装，也不会上传你的文件。</p>
    </header>
    <section aria-labelledby="tools-title">
      <div class="section-label"><strong id="tools-title">工具列表</strong><span>当前可用</span></div>
      <div class="tools">
        <a class="tool" href="./tools/%E6%8B%93%E5%8D%B0%E5%9B%BE%E7%89%87%E6%9F%A5%E7%9C%8B%E5%99%A8.html">
          <span class="tool-top"><span class="icon" aria-hidden="true">▧</span><span class="arrow" aria-hidden="true">↗</span></span>
          <span class="copy"><strong>拓印图片查看器</strong><span>全屏查看本地图片，支持缩放、拖动、10 像素位移和锁定。</span></span>
          <span class="tool-meta"><span>本地运行</span><span>移动端适配</span></span>
        </a>
      </div>
    </section>
    <footer>工具箱 · 持续收录中</footer>
  </main>
</body>
</html>
