<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="个人工具箱，快速打开常用网页工具。">
  <title>个人工具箱</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:rgba(22,31,53,.82); --line:rgba(255,255,255,.1); --text:#f5f7ff; --muted:#9da9c1; --accent:#65e6bd; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin:0; background:radial-gradient(circle at 75% -10%,#26375d 0,transparent 42%),var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,720px); min-height:100dvh; margin:auto; padding:max(28px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom)); }
    header { padding:20px 4px 28px; }
    .eyebrow { margin:0 0 10px; color:var(--accent); font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; font-size:clamp(30px,8vw,46px); letter-spacing:-.04em; }
    .intro { max-width:34em; margin:12px 0 0; color:var(--muted); line-height:1.6; }
    .tools { display:grid; gap:12px; }
    .tool { display:flex; align-items:center; gap:14px; min-height:92px; padding:16px; border:1px solid var(--line); border-radius:20px; background:var(--panel); color:inherit; text-decoration:none; box-shadow:0 12px 36px rgba(0,0,0,.16); transition:transform .18s ease,border-color .18s ease,background .18s ease; -webkit-tap-highlight-color:transparent; }
    .tool:active { transform:scale(.985); }
    .tool:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    .icon { display:grid; flex:0 0 52px; width:52px; height:52px; place-items:center; border-radius:15px; background:rgba(101,230,189,.14); color:var(--accent); font-size:26px; }
    .copy { min-width:0; flex:1; }
    .copy strong { display:block; font-size:17px; }
    .copy span { display:block; margin-top:5px; color:var(--muted); font-size:14px; line-height:1.45; }
    .arrow { color:var(--muted); font-size:24px; }
    footer { padding:28px 4px 0; color:#71809c; font-size:12px; }
    @media (hover:hover) { .tool:hover { border-color:rgba(101,230,189,.55); background:rgba(31,44,72,.9); } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Personal tools</p>
      <h1>个人工具箱</h1>
      <p class="intro">常用的小工具，打开即用。所有工具都在浏览器本地运行，不需要安装或上传文件。</p>
    </header>
    <section class="tools" aria-label="工具列表">
      <a class="tool" href="./tools/%E6%8B%93%E5%8D%B0%E5%9B%BE%E7%89%87%E6%9F%A5%E7%9C%8B%E5%99%A8.html">
        <span class="icon" aria-hidden="true">▧</span>
        <span class="copy"><strong>拓印图片查看器</strong><span>全屏查看本地图片，支持缩放、拖动、10 像素位移和锁定。</span></span>
        <span class="arrow" aria-hidden="true">›</span>
      </a>
    </section>
    <footer>工具箱 · 持续收录中</footer>
  </main>
</body>
</html>
