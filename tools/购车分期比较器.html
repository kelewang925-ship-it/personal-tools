<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>购车方案库</title>
<style>
    :root { color-scheme: dark; font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; background: #07191a; color: #eaf4ef; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: radial-gradient(circle at top right, #123b36 0, transparent 34rem), #07191a; }
    main { width: min(100%, 760px); margin: 0 auto; padding: 24px 16px 48px; }
    h1, h2, p { margin-top: 0; } h1 { margin-bottom: 6px; font-size: clamp(1.7rem, 6vw, 2.35rem); letter-spacing: -.05em; } h2 { font-size: 1.05rem; margin-bottom: 16px; }
    .muted, .meta { color: #a4b9b2; font-size: .88rem; } .page-head { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin: 10px 0 26px; }
    .card, .car, .finance { border: 1px solid rgba(178, 232, 213, .15); border-radius: 18px; background: rgba(14, 43, 42, .9); }
    section { padding: 18px; margin: 16px 0; } .car { width: 100%; margin: 11px 0; padding: 18px; color: inherit; text-align: left; cursor: pointer; transition: transform .18s ease, border-color .18s ease; }
    .car:hover, .car:focus-visible { transform: translateY(-2px); border-color: #6bd9ae; outline: none; } .car-top, .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .car-name { font-size: 1.1rem; } .arrow { color: #83e4bd; font-size: 1.25rem; } .sum { display: block; margin: 9px 0 4px; color: #83e4bd; font-size: 1.65rem; font-weight: 760; letter-spacing: -.04em; }
    .row { padding: 13px 0; border-bottom: 1px solid rgba(178, 232, 213, .11); } .row:last-child { border-bottom: 0; } .row b { text-align: right; }
    button, input { min-height: 44px; border-radius: 11px; font: inherit; } button { border: 1px solid transparent; padding: 10px 14px; background: #83e4bd; color: #08231e; font-weight: 750; cursor: pointer; } button:hover { filter: brightness(1.06); } button:focus-visible, input:focus-visible { outline: 3px solid rgba(131, 228, 189, .38); outline-offset: 2px; }
    .ghost { background: transparent; color: #eaf4ef; border-color: rgba(178, 232, 213, .24); } .danger { color: #ffb8ad; border-color: rgba(255, 184, 173, .35); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; } .back { padding-inline: 11px; } .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
    .edit { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; } .edit label { display: grid; gap: 6px; color: #c6d8d2; font-size: .82rem; } .edit .wide { grid-column: 1 / -1; }
    input { width: 100%; border: 1px solid rgba(178, 232, 213, .22); padding: 8px 10px; background: #092322; color: #f4fcf8; } .finance { margin-top: 13px; padding: 15px; } .finance h3 { margin: 0 0 14px; font-size: 1rem; }
    .empty { padding: 34px 18px; text-align: center; color: #a4b9b2; } .result { margin: 16px 0 0; padding-top: 15px; border-top: 1px solid rgba(178, 232, 213, .12); }
    @media (max-width: 520px) { main { padding: 18px 13px 40px; } .page-head { align-items: flex-start; flex-direction: column; } .page-head > button { width: 100%; } .actions > button { flex: 1; } .edit { grid-template-columns: 1fr; } .sum { font-size: 1.45rem; } }
</style>
<main id="app"></main>
<script type="module">
import { createCar, createId, loadLibrary, renameCar, removeCar } from './car-library.js'; import { calculatePlan } from './car-loan-calculations.js';
    const root = document.querySelector('#app'), key = 'personal-tools.car-library.v1', fmt = n => new Intl.NumberFormat('zh-CN', { style: 'currency', currency: 'CNY' }).format(n || 0); let lib = loadLibrary(localStorage.getItem(key)), page = 'list', editing = false;
    const active = () => lib.cars.find(c => c.id === lib.activeId), total = c => c.expenseItems.reduce((n, x) => n + Number(x.amount || 0), 0), save = () => localStorage.setItem(key, JSON.stringify(lib));
    function result(p) { return calculatePlan({ carPrice: +p.downPayment + +p.loanAmount, downPayment: +p.downPayment, purchaseTax: 0, insurance: 0, registrationFee: 0, otherFee: 0 }, { months: +p.months, annualRate: +p.rate, fee: 0, repaymentMethod: 'annuity' }) }
    function list() { return `<div class="page-head"><div><h1>我的购车方案</h1><p class="muted">记录每辆车的落地价与分期方案</p></div><button data-new>＋ 新增购车方案</button></div>${lib.cars.map(c => `<button class="car" data-open="${c.id}"><div class="car-top"><b class="car-name">${c.name}</b><span class="arrow">›</span></div><span class="sum">${fmt(total(c))}</span><span class="meta">预计落地价 · ${c.financePlans.length} 个金融方案</span></button>`).join('')}` }
    function detail() { let c = active(), fees = editing ? `<div class="edit">${c.expenseItems.map(x => `<label>${x.label}<input data-fee="${x.id}" inputmode="decimal" type="number" value="${x.amount}"></label>`).join('')}<button class="ghost" data-addfee>＋ 新增自定义费用</button><button data-savefee>保存基本费用</button></div>` : c.expenseItems.map(x => `<div class="row"><span>${x.label}</span><b>${fmt(x.amount)}</b></div>`).join(''); return `<div class="actions"><button class="ghost back" data-back>‹ 返回</button><button class="ghost" data-name>修改名称</button><button class="ghost danger" data-delete>删除</button></div><div class="page-head"><div><h1>${c.name}</h1><p class="muted">编辑金额后会自动保存在本机</p></div></div><section class="card"><div class="section-head"><h2>基本费用</h2><button class="ghost" data-editfee>${editing ? '取消编辑' : '编辑基本费用'}</button></div>${fees}<div class="result"><span class="meta">预计落地价</span><strong class="sum">${fmt(total(c))}</strong></div></section><section class="card"><div class="section-head"><h2>金融方案</h2><button data-addplan>＋ 新增方案</button></div>${c.financePlans.map(p => { let r = result(p); return `<article class="finance"><h3>${p.lender || '未命名贷款方'}</h3><div class="edit"><label class="wide">贷款方<input data-plan="${p.id}" data-field="lender" value="${p.lender}"></label><label>首付<input data-plan="${p.id}" data-field="downPayment" inputmode="decimal" type="number" value="${p.downPayment}"></label><label>贷款金额<input data-plan="${p.id}" data-field="loanAmount" inputmode="decimal" type="number" value="${p.loanAmount}"></label><label>年利率（%）<input data-plan="${p.id}" data-field="rate" inputmode="decimal" type="number" value="${p.rate}"></label><label>分期期数<input data-plan="${p.id}" data-field="months" inputmode="numeric" type="number" value="${p.months}"></label></div><div class="result"><div class="row"><span>每期还款</span><b>${fmt(r.monthlyPayment)}</b></div><div class="row"><span>总还款 / 总利息</span><b>${fmt(r.totalPayment)} / ${fmt(r.totalInterest)}</b></div></div></article>` }).join('') || '<p class="empty">还没有金融方案<br>点击右上角添加一个方案开始比较</p>'}</section>` }
    function render() { root.innerHTML = page === 'list' ? list() : detail() }
    function change(f) { f(); active().updatedAt = Date.now(); save(); render() }
    root.onclick = e => { let action = e.target.closest('[data-open], [data-new], [data-back], [data-editfee], [data-savefee], [data-addfee], [data-name], [data-delete], [data-addplan]'); if (!action || !root.contains(action)) return; let d = action.dataset, has = key => action.hasAttribute(`data-${key}`), c = active(); if (has('new')) { let name = prompt('购车方案名称', ''); if (name === null) return; let n = createCar(name); lib.cars.push(n); lib.activeId = n.id; page = 'detail'; save() } else if (d.open) { lib.activeId = d.open; page = 'detail' } else if (has('back')) page = 'list'; else if (has('editfee')) editing = !editing; else if (has('savefee')) editing = false; else if (has('addfee')) change(() => c.expenseItems.push({ id: createId(), label: '自定义费用', amount: 0 })); else if (has('name')) { let n = prompt('购车方案名称', c.name); if (n !== null) change(() => Object.assign(c, renameCar(c, n))) } else if (has('delete') && confirm('确定删除此购车方案？')) { lib = removeCar(lib, c.id); page = 'list'; save() } else if (has('addplan')) change(() => c.financePlans.push({ id: createId(), lender: '银行方案', downPayment: 0, loanAmount: 100000, rate: 3.6, months: 60 })); render() };
    function updateInput(t) { let c = active(); if (t.dataset.fee) { c.expenseItems.find(x => x.id === t.dataset.fee).amount = +t.value; save(); return true } if (t.dataset.plan) { let p = c.financePlans.find(x => x.id === t.dataset.plan), f = t.dataset.field; p[f] = ['downPayment', 'loanAmount', 'rate', 'months'].includes(f) ? +t.value : t.value; save(); return true } return false }
    root.oninput = e => updateInput(e.target); root.onchange = e => { if (updateInput(e.target)) render() }; render();
</script>

</html>
